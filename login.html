<!DOCTYPE html>
<html lang="fa">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WOLF X Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
direction:rtl;
color:#fff;
overflow:hidden;
}

/* ویدیو پس‌زمینه */
#bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

/* لایه تیره */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
z-index:-1;
}

.container{

width:420px;
max-width:90%;

padding:40px;
text-align:center;

background:rgba(20,20,20,.45);

backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);

border:1px solid rgba(0,247,255,.5);
border-radius:22px;

box-shadow:
0 0 25px rgba(0,247,255,.45),
0 0 50px rgba(0,0,0,.6);

animation:fade .8s;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

h1{
font-size:42px;
margin-bottom:15px;
color:#00f7ff;
text-shadow:0 0 15px #00f7ff;
}

p{
margin-bottom:25px;
color:#ddd;
}

input{

width:100%;
padding:15px;
margin:10px 0;

border:none;
border-radius:12px;

outline:none;

background:rgba(255,255,255,.12);
color:#fff;
font-size:16px;

}

input::placeholder{
color:#ddd;
}

button{

width:100%;
padding:15px;
margin-top:15px;

border:none;
border-radius:12px;

background:linear-gradient(135deg,#00f7ff,#005eff);

color:#fff;

font-size:18px;
font-weight:bold;

cursor:pointer;

transition:.3s;

box-shadow:0 0 20px rgba(0,247,255,.45);

}

button:hover{
transform:translateY(-3px);
box-shadow:0 0 35px #00f7ff;
}

button:active{
transform:scale(.98);
}

a{
text-decoration:none;
}

</style>

</head>

<body>

<video autoplay muted loop playsinline id="bg-video">
<source src="InShot_20260701_102019610 (6).mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">

<h1>🐺 WOLF X</h1>

<p>ورود به باشگاه اختصاصی</p>

<input type="text" placeholder="نام کاربری">

<input type="password" placeholder="رمز عبور">

<input type="text" placeholder="کلمه امنیتی">

<a href="rooms.html">
<button>🚀 ورود</button>
</a>

</div>

<script src="script.js"></script>

</body>
</html>
